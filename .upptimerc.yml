owner: 8071-HAR0208 # Your GitHub organization or username, where this repository lives
repo: status # The name of this repository

sites:
  - name: Website
    url: https://nixie.online
  - name: Download Server
    url: https://dl.nixie.online
  - name: GitScrobble
    url: https://gitscrobble.nixie.online
  - name: No as a Service API
    url: https://naas.api.nixie.online
  - name: Microsoft Key Management Server (KMS
    check: tcp-ping
    url: kms.nixie.online
    port: 1688

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.nixie.online
  # baseUrl: /your-repo-name
  logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/statuspage.svg
  name: Upptime
  introTitle: "Nixie Service Status"
  introMessage: Monitoring the status of all Nix Hartogh services.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

